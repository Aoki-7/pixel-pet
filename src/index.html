<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>PixelPet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #stage:active {
      cursor: grabbing;
    }
    #hud {
      position: absolute;
      top: 4px;
      left: 4px;
      font: 10px/1.4 Consolas, "Courier New", monospace;
      color: #2b2b2b;
      background: rgba(255, 255, 255, 0.62);
      padding: 4px 6px;
      border-radius: 4px;
      pointer-events: none;
      white-space: pre;
      display: none;
      z-index: 5;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 12px Consolas, monospace;
      color: #888;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="200" height="200"></canvas>
  <div id="hud"></div>
  <div id="loading">正在孵化…</div>
  <script src="nca.js"></script>
  <script src="interact.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
